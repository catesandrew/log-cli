name: ci

# Runs typecheck + test so the agent-ops dispatch pipeline has a real status
# check to gate auto-merge on -- decideAutoMerge() in agent-ops'
# scripts/dispatch requires ciState === "success", matching
# knowledge-base/config.yml's test_command ("bun test && tsc --noEmit").
#
# `bun test` was left out 2026-08-29 through 2026-09-07: main had 8
# pre-existing e2e-smoke test failures caused by two committed fixture files
# (examples/mixed.log, examples/mixed-2.log) being silently untracked --
# excluded by a contributor's global `*.log` gitignore rule, with no
# git-status signal that they were ever missing. Fixed via an explicit
# `!examples/*.log` repo-level gitignore exception; `bun test` re-added here
# now that main is green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test

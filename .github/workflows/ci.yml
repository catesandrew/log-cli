name: ci

# Runs typecheck so the agent-ops dispatch pipeline has a real status check to gate
# auto-merge on -- until this exists, decideAutoMerge() in agent-ops' scripts/dispatch
# always holds PRs for a human, dependency bumps included, since it requires
# ciState === "success".
#
# `bun test` deliberately left OUT of CI for now (2026-08-29): `main` already has 8
# pre-existing test failures unrelated to this workflow, and knowledge-base/config.yml's
# test_command ("bun test && tsc --noEmit") would keep this permanently red -- and
# auto-merge permanently blocked -- until those are fixed as a separate piece of work.
# Re-add `bun test` here once that's done, and this comment can go.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
